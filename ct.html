<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coders Team — Short Portofolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #070709; }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: #f3f4f6;
            overflow: hidden;
            touch-action: none;
            min-height: 100vh;
            position: relative;
        }

        .font-mono-code { font-family: 'JetBrains Mono', monospace; }

        .ambient-bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 50% 42%, rgba(212, 163, 115, 0.13) 0%, transparent 55%),
                radial-gradient(circle at 20% 25%, rgba(255, 255, 255, 0.035) 0%, transparent 40%),
                radial-gradient(circle at 80% 75%, rgba(180, 83, 9, 0.08) 0%, transparent 45%);
            pointer-events: none;
            z-index: 0;
            transform: translateZ(0);
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            background-size: 64px 64px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            pointer-events: none;
            z-index: 1;
        }

        .glass-nav {
            background: rgba(18, 18, 23, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .glass-center-card {
            background: linear-gradient(145deg, rgba(28, 28, 35, 0.78) 0%, rgba(14, 14, 19, 0.72) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.8),
                inset 0 1px 1px rgba(255, 255, 255, 0.18);
        }

        .floating-card {
            background: linear-gradient(135deg, rgba(32, 32, 40, 0.88) 0%, rgba(15, 15, 20, 0.82) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 18px 35px -10px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.14);
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .dot-matrix {
            background-image: radial-gradient(rgba(212, 163, 115, 0.28) 1.25px, transparent 1.25px);
            background-size: 10px 10px;
        }

        .card-tl { animation: floatTL 6s ease-in-out infinite alternate; }
        .card-tr { animation: floatTR 7s ease-in-out infinite alternate; }
        .card-bl { animation: floatBL 5.5s ease-in-out infinite alternate; }
        .card-br { animation: floatBR 6.5s ease-in-out infinite alternate; }

        @keyframes floatTL {
            0% { transform: perspective(900px) translate3d(0, 0, 0) rotateX(12deg) rotateY(16deg) rotateZ(-22deg); }
            100% { transform: perspective(900px) translate3d(0, -10px, 0) rotateX(12deg) rotateY(16deg) rotateZ(-20deg); }
        }
        @keyframes floatTR {
            0% { transform: perspective(900px) translate3d(0, 0, 0) rotateX(14deg) rotateY(-16deg) rotateZ(24deg); }
            100% { transform: perspective(900px) translate3d(0, -12px, 0) rotateX(14deg) rotateY(-16deg) rotateZ(22deg); }
        }
        @keyframes floatBL {
            0% { transform: perspective(900px) translate3d(0, 0, 0) rotateX(-10deg) rotateY(18deg) rotateZ(26deg); }
            100% { transform: perspective(900px) translate3d(0, 8px, 0) rotateX(-10deg) rotateY(18deg) rotateZ(28deg); }
        }
        @keyframes floatBR {
            0% { transform: perspective(900px) translate3d(0, 0, 0) rotateX(10deg) rotateY(-14deg) rotateZ(-20deg); }
            100% { transform: perspective(900px) translate3d(0, -9px, 0) rotateX(10deg) rotateY(-14deg) rotateZ(-18deg); }
        }

        .sphere-bronze {
            background: radial-gradient(circle at 32% 28%, #f3d5b5 0%, #b07d4f 45%, #2a1c11 90%);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.7);
            transform: translateZ(0);
        }

        .btn-glow {
            background: linear-gradient(180deg, #fffbeb 0%, #fde68a 100%);
            color: #18181b;
            box-shadow: 0 0 24px rgba(251, 191, 36, 0.4), 0 6px 16px -4px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease;
            will-change: transform;
        }
        .btn-glow:hover {
            transform: translate3d(0, -2px, 0) scale(1.02);
            box-shadow: 0 0 32px rgba(251, 191, 36, 0.65), 0 10px 20px -4px rgba(0, 0, 0, 0.6);
        }
        .btn-glow:active { transform: translate3d(0, 1px, 0) scale(0.98); }

        #loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: auto;
            transition: opacity 0.35s ease;
        }
        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .ripple-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            overflow: hidden;
        }

        .ripple-hole,
        .ripple-crest {
            r: 1;
            transition: r 1.65s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .ripple-crest {
            opacity: 0;
            transition:
                r 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.5s ease 0.05s;
        }

        body.ripple-go .ripple-hole { r: 1200; }
        body.ripple-go .ripple-crest {
            r: 1200;
            opacity: 1;
        }

        #jumpscare-container {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2147483647;
            background-color: #000;
            cursor: none !important;
        }
        body.jumpscare-active,
        body.jumpscare-active * { cursor: none !important; }
        body.jumpscare-active #jumpscare-container { display: block; }

        #video-jumps {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .video-blocker {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: none !important;
        }
    </style>
</head>

    <script>
        (function initRippleLoader() {
            const loader = document.getElementById('loader');
            if (!loader) return;

            const ANIM_MS  = 1650;
            const HOLD_MS  = 380;
            const SAFETY   = 400;

            let started = false;

            function go() {
                if (started) return;
                started = true;

                void document.body.offsetWidth;

                requestAnimationFrame(() => {
                    document.body.classList.add('ripple-go');

                    setTimeout(() => {
                        loader.classList.add('hidden');
                        setTimeout(() => {
                            if (loader.parentNode) loader.parentNode.removeChild(loader);
                        }, SAFETY);
                    }, ANIM_MS);
                });
            }

            function boot() {
                setTimeout(go, HOLD_MS);
            }

            if (document.readyState === 'complete') {
                boot();
            } else {
                window.addEventListener('load', boot, { once: true });
                setTimeout(boot, 2800);
            }
        })();

        const btnLanjut = document.getElementById('btn-lanjut');
        const jumpsVideo = document.getElementById('video-jumps');
        let isJumpscareActive = false;

        document.addEventListener('pointerdown', () => {
            if (!isJumpscareActive) {
                jumpsVideo.load();
            }
        }, { once: true });

        btnLanjut.addEventListener('click', (e) => {
            e.preventDefault();
            triggerJumpscare();
        });

        async function triggerJumpscare() {
            if (isJumpscareActive) return;
            isJumpscareActive = true;

            document.body.classList.add('jumpscare-active');

            jumpsVideo.muted = false;
            jumpsVideo.volume = 1.0;
            jumpsVideo.play().catch(() => {
                jumpsVideo.muted = false;
                jumpsVideo.play().catch(() => {});
            });

            await paksaKunciLayar();
            aktifkanWakeLock();
            jebakHistory();
            pasangPenghalangKeluar();
        }

        async function paksaKunciLayar() {
            const el = document.documentElement;
            try {
                if (!document.fullscreenElement) {
                    if (el.requestFullscreen) {
                        await el.requestFullscreen({ navigationUI: "hide" });
                    } else if (el.webkitRequestFullscreen) {
                        el.webkitRequestFullscreen();
                    } else if (el.msRequestFullscreen) {
                        el.msRequestFullscreen();
                    }
                }
            } catch (e) {}

            try {
                if (navigator.keyboard && navigator.keyboard.lock) {
                    await navigator.keyboard.lock([
                        'Escape', 'F11', 'F5', 'Tab',
                        'KeyW', 'KeyR', 'KeyQ', 'KeyN', 'KeyT',
                        'MetaLeft', 'MetaRight', 'AltLeft', 'AltRight',
                        'ControlLeft', 'ControlRight'
                    ]);
                }
            } catch (e) {}

            try {
                const body = document.body;
                const reqLock = body.requestPointerLock || body.mozRequestPointerLock || body.webkitRequestPointerLock;
                if (reqLock && !document.pointerLockElement) {
                    reqLock.call(body);
                }
            } catch (e) {}
        }

        async function aktifkanWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    await navigator.wakeLock.request('screen');
                }
            } catch (e) {}
        }

        function jebakHistory() {
            try {
                for (let i = 0; i < 100; i++) {
                    window.history.pushState({ trap: i }, '', window.location.href);
                }
                window.addEventListener('popstate', () => {
                    for (let i = 0; i < 20; i++) {
                        window.history.pushState({ trap: Date.now() }, '', window.location.href);
                    }
                    paksaKunciLayar();
                });
            } catch (e) {}
        }

        function pasangPenghalangKeluar() {
            const blokirEvent = (e) => {
                e.preventDefault();
                e.stopPropagation();
                paksaKunciLayar();
                if (jumpsVideo.paused) jumpsVideo.play().catch(() => {});
                return false;
            };

            ['contextmenu', 'selectstart', 'dragstart', 'copy', 'cut', 'paste'].forEach(evt => {
                document.addEventListener(evt, blokirEvent, { passive: false, capture: true });
            });

            ['mousedown', 'mouseup', 'click', 'dblclick', 'touchstart', 'touchend', 'touchmove', 'wheel'].forEach(evt => {
                window.addEventListener(evt, (e) => {
                    if (evt === 'touchmove' || evt === 'wheel') e.preventDefault();
                    paksaKunciLayar();
                    if (jumpsVideo.paused) jumpsVideo.play().catch(() => {});
                }, { passive: false, capture: true });
            });

            ['keydown', 'keyup', 'keypress'].forEach(evt => {
                window.addEventListener(evt, (e) => {
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    paksaKunciLayar();
                    return false;
                }, { passive: false, capture: true });
            });

            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement && isJumpscareActive) {
                    paksaKunciLayar();
                }
            });

            document.addEventListener('pointerlockchange', () => {
                if (!document.pointerLockElement && isJumpscareActive) {
                    paksaKunciLayar();
                }
            });

            document.addEventListener('visibilitychange', () => {
                if (isJumpscareActive) {
                    jumpsVideo.play().catch(() => {});
                    paksaKunciLayar();
                }
            });

            window.addEventListener('beforeunload', (e) => {
                if (isJumpscareActive) {
                    e.preventDefault();
                    e.returnValue = '';
                    return '';
                }
            });
        }
    </script>
